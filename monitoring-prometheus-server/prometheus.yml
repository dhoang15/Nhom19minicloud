global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets:
          - monitoring-node-exporter-server:9100

  - job_name: web-nginx
    static_configs:
      - targets:
          - web-nginx-exporter1:9113
          - web-nginx-exporter2:9113

  - job_name: prometheus
    static_configs:
      - targets:
          - monitoring-prometheus-server:9090
